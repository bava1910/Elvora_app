<script>
const $=s=>document.querySelector(s),pad=x=>String(x).padStart(2,'0');
const CATS=['Computer Science','Information Technology','Electronics','Mechanical','Civil','General'];
const otherLoc=b=>({rack:'R'+pad(+b.rack.slice(1)%10+1),shelf:'S'+pad((+b.shelf.slice(1)+2)%5+1)});
/* ===== DATA SERVICE (localStorage). Only this layer touches storage. ===== */
const LibraryDB=(()=>{const rd=k=>JSON.parse(localStorage.getItem('sl_'+k)||'[]'),wr=(k,v)=>localStorage.setItem('sl_'+k,JSON.stringify(v)),db={};
[['students','Students','Student'],['books','Books','Book'],['transactions','Transactions','Transaction'],['sessions','Sessions','Session'],['misplaced','MisplacedBooks','MisplacedBook'],['logs','ScanLogs','ScanLog'],['notifs','Notifications','Notification']].forEach(([k,P,Sg])=>{db['get'+P]=()=>rd(k);db['add'+Sg]=o=>{const a=rd(k);a.push(o);wr(k,a);return o};db['update'+Sg]=(id,p)=>{const a=rd(k),i=a.findIndex(x=>x.id===id);if(i<0)return null;Object.assign(a[i],p);wr(k,a);return a[i]}});
db.getAuth=()=>JSON.parse(localStorage.getItem('sl_auth')||'null');db.setAuth=u=>u?localStorage.setItem('sl_auth',JSON.stringify(u)):localStorage.removeItem('sl_auth');
db.markAllRead=()=>wr('notifs',rd('notifs').map(n=>({...n,read:true})));db.seeded=()=>!!localStorage.getItem('sl_students');
db.reset=()=>{const n=Date.now(),H=36e5,DY=24*H,iso=m=>new Date(n+m).toISOString();
wr('students',[['STU1023','Arun Kumar',0,3],['STU1045','Priya Nair',1,2],['STU1067','Rahul Sharma',2,4],['STU1081','Divya Lakshmi',0,1],['STU1094','Karthik Raja',3,3],['STU1102','Sneha Iyer',4,2],['STU1118','Mohammed Faizal',1,4],['STU1126','Anjali Menon',2,1],['STU1139','Vikram Singh',3,2],['STU1150','Meena Krishnan',0,4]].map(([id,name,c,y])=>({id,name,dept:CATS[c],year:y,email:name.split(' ')[0].toLowerCase()+'@smartlibrary.edu',pw:'1234',status:'Active'})));
const bk=`Introduction to Algorithms|Thomas H. Cormen|0
Database Management Systems|Raghu Ramakrishnan|0
Computer Networks|Andrew S. Tanenbaum|1
Operating System Concepts|Abraham Silberschatz|0
Artificial Intelligence: A Modern Approach|Stuart Russell|0
Machine Learning|Tom M. Mitchell|0
Web Development with Node and Express|Ethan Brown|1
Digital Electronics|M. Morris Mano|2
Engineering Mathematics|K. A. Stroud|5
Software Engineering|Ian Sommerville|1
Clean Code|Robert C. Martin|0
Data Structures|Mark Allen Weiss|0
Cloud Computing Fundamentals|Rajkumar Buyya|1
Information Security|William Stallings|1
Microprocessors and Interfacing|Ramesh Gaonkar|2
Microelectronic Circuits|Sedra and Smith|2
Signals and Systems|Alan Oppenheim|2
Embedded Systems|Raj Kamal|2
Engineering Thermodynamics|P. K. Nag|3
Fluid Mechanics|Frank White|3
Strength of Materials|R. K. Bansal|4
Machine Design|V. B. Bhandari|3
Structural Analysis|C. S. Reddy|4
Surveying|B. C. Punmia|4
Concrete Technology|M. S. Shetty|4
Python Crash Course|Eric Matthes|1
Discrete Mathematics|Kenneth Rosen|0
The Pragmatic Programmer|Andrew Hunt|5
Communication Skills|Meenakshi Raman|5
Indian Polity|M. Laxmikanth|5`.split('\n').map((l,i)=>{const [title,author,c]=l.split('|');return{id:'BK'+(1001+i),title,author,isbn:`978-0-${1000+i*37}-${2000+i*53}-${i%10}`,cat:CATS[c],floor:[1,1,2,3,3,1][c],section:CATS[c],rack:'R'+pad(i%10+1),shelf:'S'+pad(i*3%5+1),status:'AVAILABLE'}});
['BK1003','BK1004','BK1007','BK1019'].forEach(id=>bk.find(b=>b.id===id).status='ISSUED');const mp=[['BK1005',-50],['BK1008',-30],['BK1021',-12]];mp.forEach(([id])=>bk.find(b=>b.id===id).status='MISPLACED');wr('books',bk);
wr('transactions',[['STU1023','BK1004',6,0],['STU1023','BK1019',2,0],['STU1023','BK1001',20,14],['STU1023','BK1027',12,8],['STU1045','BK1003',3,0],['STU1045','BK1026',15,9],['STU1067','BK1007',10,0],['STU1067','BK1015',18,13],['STU1081','BK1002',9,4],['STU1094','BK1022',16,10],['STU1126','BK1016',11,6]].map(([sid,bid,a,r],i)=>({id:'TX'+(1001+i),sid,bid,title:bk.find(b=>b.id===bid).title,issued:iso(-a*DY),due:iso((7-a)*DY),returned:r?iso(-r*DY):null,status:r?'RETURNED':'ISSUED'})));
wr('sessions',[['STU1023',-26*H,-23*H],['STU1045',-2*H],['STU1067',-1.5*H],['STU1081',-.75*H],['STU1118',-3*H],['STU1150',-.33*H],['STU1094',-5*H,-3.5*H],['STU1102',-6*H,-4*H]].map(([sid,a,b],i)=>({id:'LS'+(1001+i),sid,entry:iso(a),exit:b==null?null:iso(b)})));
wr('misplaced',mp.map(([id,m],i)=>{const b=bk.find(x=>x.id===id);return{id:'MP'+(1001+i),bid:id,title:b.title,exp:{rack:b.rack,shelf:b.shelf},det:otherLoc(b),at:iso(m*6e4),status:'MISPLACED'}}));
wr('logs',[['BOOK SCAN','BK1005','MISPLACED',-50],['BOOK SCAN','BK1012','SUCCESS',-45],['BOOK SCAN','BK1008','MISPLACED',-30],['STUDENT SCAN','STU1150','SUCCESS',-20],['BOOK SCAN','BK1021','MISPLACED',-12],['BOOK SCAN','BK1009','SUCCESS',-8]].map(([type,ref,result,m],i)=>({id:'SC'+(1001+i),at:iso(m*6e4),type,ref,result,sid:null,label:''})));
wr('notifs',[{id:'N1',at:iso(-3e5),text:'Book is due tomorrow.',type:'warn',read:false},{id:'N2',at:iso(-H*30),text:'Library entry recorded.',type:'ok',read:true}])};
return db})();
if(!LibraryDB.seeded())LibraryDB.reset();
/* ===== API SERVICE. Replace bodies with fetch('/api/...') later; UI stays unchanged. ===== */
const API=(()=>{const DB=LibraryDB,delay=ms=>new Promise(r=>setTimeout(r,ms)),uq=()=>Date.now()+Math.random().toString(36).slice(2,5),
log=(type,ref,result,sid,label)=>DB.addScanLog({id:'SC'+uq(),at:new Date().toISOString(),type,ref,result,sid:sid||null,label:label||''}),
note=(text,type='ok')=>DB.addNotification({id:'N'+uq(),at:new Date().toISOString(),text,type,read:false}),
bookOf=id=>DB.getBooks().find(b=>b.id===String(id).toUpperCase()),actS=sid=>DB.getSessions().find(s=>s.sid===sid&&!s.exit),L=o=>o.rack+' / '+o.shelf;
async function scanBook(id,mode,sid,src='BOOK SCAN'){await delay(1500);let b=bookOf(id);if(!b){log(src,id,'NOT FOUND',sid);throw new Error('No book found with this ID.')}
const det=mode==='mis'&&b.status!=='ISSUED'?otherLoc(b):{rack:b.rack,shelf:b.shelf},mis=det.rack!==b.rack||det.shelf!==b.shelf;
if(mis){if(b.status!=='MISPLACED'){DB.addMisplacedBook({id:'MP'+(1001+DB.getMisplacedBooks().length),bid:b.id,title:b.title,exp:{rack:b.rack,shelf:b.shelf},det,at:new Date().toISOString(),status:'MISPLACED'});b=DB.updateBook(b.id,{status:'MISPLACED'});note('Misplaced book detected: '+b.title+'.','warn')}}
else if(b.status==='MISPLACED'){DB.getMisplacedBooks().filter(m=>m.bid===b.id&&m.status==='MISPLACED').forEach(m=>DB.updateMisplacedBook(m.id,{status:'RESOLVED'}));b=DB.updateBook(b.id,{status:'AVAILABLE'})}
log(src,b.id,mis?'MISPLACED':'SUCCESS',sid,b.title);return{book:b,detected:det,misplaced:mis}}
const A={
auth:{current:()=>DB.getAuth(),logout:()=>DB.setAuth(null),login:async(role,id,pw)=>{await delay(450);id=id.trim().toUpperCase();let u=null;
if(role==='admin'){if(id==='ADMIN001'&&pw==='admin123')u={id,name:'Librarian',role}}else{const s=DB.getStudents().find(x=>x.id===id&&x.pw===pw&&x.status==='Active');if(s)u={id,name:s.name,role}}
if(!u)throw new Error(role==='admin'?'Invalid admin ID or password.':'Invalid student ID or password.');DB.setAuth(u);return u}},
books:{getAll:async()=>DB.getBooks(),getById:async id=>{const b=bookOf(id);if(!b)throw new Error('No book found with this ID.');return b},scan:(id,mode='ok',sid)=>scanBook(id,mode,sid),
add:async b=>{if(bookOf(b.id))throw new Error('A book with this ID already exists.');return DB.addBook(b)},update:async(id,p)=>DB.updateBook(id,p),
issue:async(sid,bid)=>{await delay(400);const b=bookOf(bid);if(!b)throw new Error('No book found with this ID.');if(b.status==='ISSUED')throw new Error('This book is currently issued.');if(b.status==='MISPLACED')throw new Error('This book is flagged as misplaced and cannot be issued.');
const n=new Date(),t={id:'TX'+(1001+DB.getTransactions().length),sid,bid:b.id,title:b.title,issued:n.toISOString(),due:new Date(+n+7*864e5).toISOString(),returned:null,status:'ISSUED'};DB.addTransaction(t);DB.updateBook(b.id,{status:'ISSUED'});log('BOOK ISSUE',b.id,'SUCCESS',sid,b.title);note('Book issued successfully: '+b.title+'.');return t},
return:async txId=>{await delay(400);const t=DB.getTransactions().find(x=>x.id===txId&&x.status==='ISSUED');if(!t)throw new Error('Unable to process return.');

async function openReturn(id){const t=D.tx.find(x=>x.id===id);modal(`<h3 class="ct">Return Book</h3><div class="frame on" style="height:200px"><i></i><i></i><i></i><i></i><div class="beam"></div>${ic('book',50)}</div><p class="ct"><b>Scanning...</b></p>`);await new Promise(r=>setTimeout(r,1600));
setM(`<div class="obox">${ic('check')} Book detected</div>${kv([['Book ID',t.bid],['Title',e(t.title)],['Issued',fD(t.issued)],['Due',fD(t.due)]])}<div class="acts"><button class="btn l" onclick="closeM()">Cancel</button><button class="btn g" onclick="doReturn('${id}')">Confirm Return</button></div>`)}
async function doReturn(id){try{const t=await API.books.return(id);done('BOOK RETURNED SUCCESSFULLY',[['Book',e(t.title)],['Returned',fT(t.returned)]]);toast('Book returned successfully.');render()}catch(x){closeM();toast(x.message,'err')}}
function sProfile(){const s=D.students.find(x=>x.id===S.user.id),t=D.tx.filter(x=>x.sid===s.id);return`<div class="card ct"><div class="logo" style="width:80px;height:80px;border-radius:50%;font-size:26px;font-weight:700">${s.name.split(' ').map(w=>w[0]).join('')}</div><h3>${e(s.name)}</h3><small>${s.id}</small></div>
<div class="sum"><div><b>${t.length}</b><small>Borrowed</small></div><div><b>${t.filter(x=>x.status==='RETURNED').length}</b><small>Returned</small></div><div><b>${D.sessions.filter(x=>x.sid===s.id).length}</b><small>Visits</small></div></div>
<div class="card">${kv([['Department',s.dept],['Year',s.year],['Email',s.email]])}</div><button class="btn w d" onclick="logout()">${ic('out')} Logout</button>`}
/* admin shell */
const NAV=[['dash','Dashboard','grid'],['books','Books','book'],['students','Students','users'],['tx','Transactions','list'],['mis','Misplaced Books','alert'],['act','Library Activity','act'],['mon','Scan Monitor','scan'],['hw','Hardware Simulation','cpu'],['set','Settings','gear']];
function adminV(){const V={dash:aDash,books:aBooks,students:aStu,tx:aTx,mis:aMis,act:aAct,mon:aMon,hw:aHw,set:aSet}[S.adm](),mc=D.mis.filter(m=>m.status==='MISPLACED').length;
return`<div class="adm ${S.side?'tg':''}"><aside class="sb"><div class="brand"><div class="logo">${ic('book',18)}</div>SMART LIBRARY</div>${NAV.map(([k,l,i])=>`<button class="${S.adm===k?'on':''}" onclick="ago('${k}')">${ic(i,18)}<span style="flex:1">${l}</span>${k==='mis'&&mc?`<span class="bdg r">${mc}</span>`:''}</button>`).join('')}<div style="flex:1"></div><button onclick="logout()">${ic('out',18)} Logout</button></aside><div class="scrim" onclick="S.side=0;render()"></div>
<div class="mn"><header class="ah"><button class="ib x" aria-label="Toggle menu" onclick="S.side=!S.side;render()">${ic('menu')}</button><h1>${NAV.find(n=>n[0]===S.adm)[1]}</h1><span class="bdg o">DEMO MODE</span></header><main class="ap ${S.anim?'fx':''}">${V}</main></div></div>`}
function stats(){const b=D.books,c=s=>b.filter(x=>x.status===s).length;return{total:2420+b.length,av:2085+c('AVAILABLE'),is:282+c('ISSUED'),mis:15+c('MISPLACED'),stu:814+D.students.length,ins:38+D.sessions.filter(s=>!s.exit).length}}
const txRow=t=>{const s=eff(t),d=t.returned||t.issued;return`<div class="rw"><div class="gr"><b>${e(sn(t.sid))}</b><small>${t.sid}</small></div><div class="gr"><b>${e(t.title)}</b><small>${t.bid}</small></div><div><small>Action</small><b>${t.status==='RETURNED'?'Returned':'Issued'}</b></div><div><small>${fD(d)} · ${fT(d)}</small><br><small>Due ${fD(t.due)}</small></div>${sb(s)}</div>`};
const misCard=m=>`<div class="card" style="border-left:5px solid ${m.status==='MISPLACED'?'var(--r)':'var(--g)'}"><div class="rw" style="padding:0;border:0"><div class="gr"><b>${e(m.title)}</b><small>${m.bid}</small></div>${sb(m.status)}</div>${kv([['Expected',lc(m.exp)],['Detected',lc(m.det)],['Detected at',fA(m.at)]])}<div class="acts"><button class="btn l s" onclick="openBook('${m.bid}')">VIEW BOOK</button>${m.status==='MISPLACED'?`<button class="btn g s" onclick="resolveM('${m.id}')">MARK AS RESOLVED</button>`:''}</div></div>`;
function aDash(){const s=stats(),c=[['TOTAL BOOKS',s.total,'book',''],['AVAILABLE',s.av,'check','g'],['ISSUED',s.is,'list',''],['MISPLACED',s.mis,'alert','r'],['TOTAL STUDENTS',s.stu,'users',''],['CURRENTLY INSIDE',s.ins,'pin','o']],tx=[...D.tx].sort((a,b)=>new Date(b.returned||b.issued)-new Date(a.returned||a.issued)).slice(0,5),ms=[...D.mis].reverse().slice(0,3),lg=[...D.logs].reverse().slice(0,6);
return`<div class="g3">${c.map(([l,v,i,k])=>`<div class="card st hv"><span class="ico ${k}">${ic(i)}</span><div><small>${l}</small><b data-n="${v}">${v.toLocaleString()}</b></div></div>`).join('')}</div>
<div class="g2"><div class="card"><h4 style="margin-top:0">RECENT TRANSACTIONS</h4>${tx.map(txRow).join('')}</div><div><h4 style="margin:0 0 8px">RECENT MISPLACED ALERTS</h4>${ms.length?ms.map(misCard).join(''):'<div class="card">'+empty('No alerts','No misplaced books recorded.')+'</div>'}</div></div>
<div class="card"><h4 style="margin-top:0">LIBRARY ACTIVITY</h4>${lg.map(logRow).join('')}</div>`}
const logRow=l=>`<div class="rw"><small style="width:70px">${fS(l.at)}</small><div class="gr"><b>${l.type}</b></div><div class="gr"><b>${e(l.ref)}</b></div>${sb(l.result)}</div>`;
const bRow=b=>`<div class="rw"><div class="gr"><b>${e(b.title)}</b><small>${b.id} · ${e(b.author)}</small></div><div class="gr"><small>${b.cat}</small><br><small>F${b.floor} · ${b.rack} / ${b.shelf}</small></div>${sb(b.status)}<button class="btn l s" onclick="openBook('${b.id}')">View</button><button class="btn l s" onclick="bookForm('${b.id}')">Edit</button></div>`;
const aList=()=>{const q=S.aq.toLowerCase(),r=D.books.filter(b=>(S.acat==='All'||b.cat===S.acat)&&[b.title,b.author,b.id,b.isbn].join(' ').toLowerCase().includes(q));return r.length?r.map(bRow).join(''):empty('No books found','Try changing the search or category.')};
function aBooks(){return`<div class="bar"><input placeholder="Search books..." aria-label="Search books" value="${e(S.aq)}" oninput="S.aq=this.value;$('#al').innerHTML=aList()"><select aria-label="Category" onchange="S.acat=this.value;render()">${['All',...CATS].map(c=>`<option ${c===S.acat?'selected':''}>${c}</option>`).join('')}</select><button class="btn" onclick="bookForm()">${ic('plus',18)} Add Book</button></div><div class="card" id="al">${aList()}</div>`}
const fld=(k,l,v='',o={})=>`<div><label for="f_${k}">${l}</label>${o.opts?`<select id="f_${k}">${o.opts.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="f_${k}" value="${e(v)}" ${o.ro?'readonly':''}>`}</div>`,gv=k=>$('#f_'+k).value.trim();
function bookForm(id){const b=D.books.find(x=>x.id===id)||{id:'BK'+(1001+D.books.length),cat:CATS[0],floor:1,section:CATS[0],rack:'R01',shelf:'S01',status:'AVAILABLE'};
modal(`<h3>${id?'Edit':'Add'} Book</h3><div class="fg">${fld('id','Book ID',b.id,{ro:!!id})}${fld('isbn','ISBN',b.isbn)}</div>${fld('title','Title',b.title)}${fld('author','Author',b.author)}<div class="fg">${fld('cat','Category',b.cat,{opts:CATS})}${fld('status','Status',b.status,{opts:['AVAILABLE','ISSUED','MISPLACED']})}${fld('floor','Floor',b.floor)}${fld('section','Section',b.section)}${fld('rack','Rack',b.rack)}${fld('shelf','Shelf',b.shelf)}</div><div class="acts"><button class="btn l" onclick="closeM()">Cancel</button><button class="btn" onclick="saveBook(${!!id})">Save Book</button></div>`)}
async function saveBook(ed){const b={};['id','title','author','isbn','cat','floor','section','rack','shelf','status'].forEach(k=>b[k]=gv(k));if(!b.id||!b.title||!b.author)return toast('Book ID, title and author are required.','err');b.id=b.id.toUpperCase();b.floor=+b.floor||1;try{ed?await API.books.update(b.id,b):await API.books.add(b);closeM();toast('Book saved.');render()}catch(x){toast(x.message,'err')}}
function aStu(){return`<div class="bar"><div style="flex:1"><small>${D.students.length} students registered</small></div><button class="btn" onclick="stuForm()">${ic('plus',18)} Add Student</button></div><div class="card">${D.students.map(s=>`<div class="rw"><div class="gr"><b>${e(s.name)}</b><small>${s.id}</small></div><div class="gr"><small>${s.dept} · Year ${s.year}</small><br><small>Books: ${D.tx.filter(t=>t.sid===s.id&&t.status==='ISSUED').length}</small></div>${sb(s.status)}<button class="btn l s" onclick="viewStu('${s.id}')">View</button><button class="btn l s" onclick="stuForm('${s.id}')">Edit</button></div>`).join('')}</div>`}
function stuForm(id){const s=D.students.find(x=>x.id===id)||{id:'STU'+(1160+D.students.length),dept:CATS[0],year:1,status:'Active'};modal(`<h3>${id?'Edit':'Add'} Student</h3><div class="fg">${fld('id','Student ID',s.id,{ro:!!id})}${fld('year','Year',s.year,{opts:[1,2,3,4]})}</div>${fld('name','Name',s.name)}${fld('email','Email',s.email)}<div class="fg">${fld('dept','Department',s.dept,{opts:CATS})}${fld('status','Status',s.status,{opts:['Active','Inactive']})}</div><div class="acts"><button class="btn l" onclick="closeM()">Cancel</button><button class="btn" onclick="saveStu(${!!id})">Save Student</button></div>`)}
async function saveStu(ed){const s={id:gv('id').toUpperCase(),name:gv('name'),email:gv('email'),dept:gv('dept'),year:+gv('year'),status:gv('status')};if(!s.id||!s.name)return toast('Student ID and name are required.','err');try{ed?await API.students.update(s.id,s):await API.students.add(s);closeM();toast('Student saved.');render()}catch(x){toast(x.message,'err')}}
function viewStu(id){const s=D.students.find(x=>x.id===id),t=D.tx.filter(x=>x.sid===id),ss=D.sessions.filter(x=>x.sid===id);modal(`<div class="rw" style="border:0"><div class="gr"><h3>${e(s.name)}</h3><small>${s.id}</small></div><button class="ib x" aria-label="Close" onclick="closeM()">${ic('x')}</button></div>${kv([['Department',s.dept],['Year',s.year],['Email',s.email],['Status',sb(s.status)]])}<h4>BORROWED BOOKS</h4>${t.filter(x=>x.status==='ISSUED').map(x=>`<div class="kvr"><span>${e(x.title)}</span>${sb(eff(x))}</div>`).join('')||'<small>None</small>'}<h4>TRANSACTION HISTORY</h4>${t.map(x=>`<div class="kvr"><span>${e(x.title)}</span><small>${fD(x.issued)} → ${x.returned?fD(x.returned):'—'}</small></div>`).join('')||'<small>None</small>'}<h4>LIBRARY ENTRY / EXIT</h4>${ss.map(x=>`<div class="kvr"><span>${fD(x.entry)}</span><small>${fT(x.entry)} - ${x.exit?fT(x.exit):'inside'}</small></div>`).join('')||'<small>None</small>'}`)}
function aTx(){const f=S.txf,l=[...D.tx].reverse().filter(t=>f==='All'||(f==='Issued'&&t.status==='ISSUED')||(f==='Returned'&&t.status==='RETURNED')||(f==='Overdue'&&eff(t)==='OVERDUE'));return`<div class="chips" style="margin-top:0">${['All','Issued','Returned','Overdue'].map(c=>`<button class="${f===c?'on':''}" onclick="S.txf='${c}';render()">${c}</button>`).join('')}</div><div class="card">${l.length?l.map(txRow).join(''):empty('No transactions','Nothing matches this filter.')}</div>`}
function aMis(){const l=[...D.mis].sort((a,b)=>(a.status==='MISPLACED'?0:1)-(b.status==='MISPLACED'?0:1)||new Date(b.at)-new Date(a.at));return l.length?`<div class="g2">${l.map(misCard).join('')}</div>`:`<div class="card">${empty('No misplaced books','All books are on their expected shelves.')}</div>`}
async function resolveM(id){try{await API.misplaced.resolve(id);toast('Alert marked as resolved.');render()}catch(x){toast(x.message,'err')}}
function aAct(){const ins=D.sessions.filter(s=>!s.exit),td=D.sessions.filter(s=>isT(s.entry)),ex=D.sessions.filter(s=>s.exit&&isT(s.exit));return`<div class="g3"><div class="card st"><span class="ico">${ic('pin')}</span><div><small>TOTAL ENTRIES TODAY</small><b>${td.length}</b></div></div><div class="card st"><span class="ico o">${ic('out')}</span><div><small>TOTAL EXITS TODAY</small><b>${ex.length}</b></div></div><div class="card st"><span class="ico g">${ic('users')}</span><div><small>CURRENTLY INSIDE</small><b>${ins.length}</b></div></div></div>
<div class="card"><h4 style="margin-top:0">STUDENTS INSIDE</h4>${ins.length?ins.map(s=>{const st=D.students.find(x=>x.id===s.sid)||{};return`<div class="rw"><div class="gr"><b>${s.sid} · ${e(st.name)}</b><small>${st.dept}</small></div><div><small>Entered</small><b>${fT(s.entry)}</b></div>${sb('INSIDE')}</div>`}).join(''):empty('Nobody inside','No students are currently in the library.')}</div>`}
function aMon(){const l=[...D.logs].reverse();return`<div class="bar"><span class="live">● LIVE</span><small>Scan events from hardware / simulation</small></div><div class="card">${l.length?l.map(logRow).join(''):empty('No scans yet','Scan events will appear here.')}</div>`}
function aHw(){const bt=[['student','Simulate Student Scan','users',''],['book','Simulate Book Scan','scan',''],['correct','Simulate Correct Shelf','check','g'],['mis','Simulate Misplaced Book','alert','d'],['notfound','Simulate Book Not Found','x','o']];
return`<div class="card"><p><small>This demo simulates scanner/hardware input. The same interface will later receive data from the real hardware.</small></p><div class="g3 mt">${bt.map(([k,l,i,c])=>`<button class="btn ${c}" onclick="hw('${k}',this)">${ic(i,18)} ${l}</button>`).join('')}</div></div>${S.hw?`<div class="card"><h4 style="margin-top:0">LAST RESULT</h4><div class="${S.hw.misplaced?'wbox':S.hw.ok?'obox':'wbox'}">${e(S.hw.msg)}</div></div>`:''}`}
async function hw(k,b){b.disabled=true;try{const r=await API.hardware.simulate(k);S.hw=r;if(r.misplaced){toast('Misplaced book detected.','warn');done('MISPLACED BOOK DETECTED',[['Book',e(r.title)],['Expected',r.exp],['Detected',r.det],['Status',sb('MISPLACED')]],'bad')}else toast(r.msg,r.ok?'ok':'err')}catch(x){toast(x.message,'err')}render()}
function aSet(){return`<div class="card"><h4 style="margin-top:0">DATA</h4><div class="bar"><button class="btn l" onclick="csv('transactions.csv',[['ID','Student','Book','Issued','Due','Returned','Status'],...D.tx.map(t=>[t.id,t.sid,t.title,t.issued,t.due,t.returned,eff(t)])])">${ic('dl',18)} Export Transactions</button><button class="btn l" onclick="csv('misplaced.csv',[['ID','Book','Title','Expected','Detected','At','Status'],...D.mis.map(m=>[m.id,m.bid,m.title,lc(m.exp),lc(m.det),m.at,m.status])])">${ic('dl',18)} Export Misplaced Books</button></div></div>
<div class="card"><h4 style="margin-top:0">DEMO</h4><p><small>Restore the original demo data before each presentation.</small></p><button class="btn d mt" onclick="modal('<h3>Reset all demo data?</h3><p class=&quot;mt&quot;><small>All changes will be lost and the original demo data restored.</small></p><div class=&quot;acts&quot;><button class=&quot;btn l&quot; onclick=&quot;closeM()&quot;>Cancel</button><button class=&quot;btn d&quot; onclick=&quot;doReset()&quot;>Reset</button></div>')">RESET DEMO DATA</button></div>`}
async function doReset(){await API.system.reset();S.hw=null;S.scan={bid:'BK1012',mis:false,phase:'idle',res:null};closeM();toast('Demo data restored.');render()}
function csv(n,rows){const t=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click();toast('Exported '+n)}
render();
</script></body></html>
